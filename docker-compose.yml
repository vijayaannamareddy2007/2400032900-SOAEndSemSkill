services:
  app-service:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: "7260"
      DB_NAME: admin
    depends_on:
      - db

  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: "7260"
      MYSQL_DATABASE: admin
    ports:
      - "3306:3306"